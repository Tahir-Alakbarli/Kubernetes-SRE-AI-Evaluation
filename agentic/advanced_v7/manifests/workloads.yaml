apiVersion: v1
kind: Namespace
metadata:
  name: market-prod
  labels:
    owner: commerce-platform
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-retry-policy
  namespace: market-prod
data:
  MAX_ATTEMPTS: "2"
  RETRY_DELAY_MS: "120"
  WORKERS: "12"
  MAX_PENDING: "250"
---
apiVersion: v1
kind: Service
metadata:
  name: reservation-engine
  namespace: market-prod
spec:
  selector:
    app: reservation-engine
  ports:
    - port: 8090
      targetPort: 8090
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-router
  namespace: market-prod
spec:
  selector:
    app: checkout-router
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reservation-engine
  namespace: market-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reservation-engine
  template:
    metadata:
      labels:
        app: reservation-engine
    spec:
      containers:
        - name: engine
          image: python:3.12-alpine
          command: ["python", "-u", "/srv/processor.py"]
          ports:
            - containerPort: 8090
          resources:
            requests:
              cpu: 30m
              memory: 32Mi
            limits:
              cpu: 800m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            periodSeconds: 3
          volumeMounts:
            - name: code
              mountPath: /srv
      volumes:
        - name: code
          configMap:
            name: runtime-processor
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-router
  namespace: market-prod
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: checkout-router
  template:
    metadata:
      labels:
        app: checkout-router
    spec:
      containers:
        - name: gateway
          image: python:3.12-alpine
          command: ["python", "-u", "/srv/gateway.py"]
          envFrom:
            - configMapRef:
                name: gateway-retry-policy
          env:
            - name: PROCESSOR_URL
              value: http://reservation-engine.market-prod.svc:8090/reserve
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 30m
              memory: 32Mi
            limits:
              cpu: 800m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 3
          volumeMounts:
            - name: code
              mountPath: /srv
      volumes:
        - name: code
          configMap:
            name: runtime-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-prober
  namespace: market-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traffic-prober
  template:
    metadata:
      labels:
        app: traffic-prober
    spec:
      containers:
        - name: client
          image: python:3.12-alpine
          command: ["sh", "-c", "sleep 360000"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 1000m
              memory: 256Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: checkout-router
  namespace: market-prod
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: checkout-router
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: checkout-ingress
  namespace: market-prod
spec:
  podSelector:
    matchLabels:
      app: checkout-router
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: traffic-prober
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: reservation-ingress
  namespace: market-prod
spec:
  podSelector:
    matchLabels:
      app: reservation-engine
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: checkout-router
      ports:
        - protocol: TCP
          port: 8090
