apiVersion: v1
kind: Namespace
metadata:
  name: market-audit
  labels:
    owner: security-assurance
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: outsider-prober
  namespace: market-audit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: outsider-prober
  template:
    metadata:
      labels:
        app: outsider-prober
    spec:
      containers:
        - name: client
          image: python:3.12-alpine
          command: ["sh", "-c", "sleep 360000"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-canary
  namespace: market-audit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audit-canary
  template:
    metadata:
      labels:
        app: audit-canary
    spec:
      containers:
        - name: canary
          image: python:3.12-alpine
          command: ["python", "-m", "http.server", "8105"]
          ports:
            - containerPort: 8105
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: audit-canary
  namespace: market-audit
spec:
  selector:
    app: audit-canary
  ports:
    - port: 8105
      targetPort: 8105
