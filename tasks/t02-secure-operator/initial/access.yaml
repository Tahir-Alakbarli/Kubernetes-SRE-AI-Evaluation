apiVersion: v1
kind: ServiceAccount
metadata:
  name: config-watcher-sa
  namespace: ops-prod
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: watcher-configmap-access
  namespace: ops-prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: configmap-observer
subjects:
- kind: ServiceAccount
  name: config-watcher-sa
  namespace: ops-prod
